<!doctype html>
<html lang="pt-BR" data-theme="noite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a10" />
    <meta name="description" content="Monte tier lists de anime, mangá e personagens com sua lista do AniList. Arraste, ranqueie no teclado e compartilhe com um link." />
    <meta property="og:title" content="AnimeTier — tier lists de anime" />
    <meta property="og:description" content="Puxe sua lista do AniList, ranqueie e compartilhe." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://graphql.anilist.co" />
    <link rel="preconnect" href="https://s4.anilist.co" />
    <title>AnimeTier</title>
    <script>
      // Apply the saved theme before first paint so there's no flash.
      try {
        var s = JSON.parse(localStorage.getItem('animetier:settings') || '{}');
        if (s.theme) document.documentElement.dataset.theme = s.theme;
        else if (matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'sakura';
        if (s.font) document.documentElement.dataset.font = s.font;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
